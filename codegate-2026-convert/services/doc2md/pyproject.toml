[project]
name = "doc2md"
version = "0.2.1"
description = "Native-Python document-to-markdown conversion API (markitdown + pyhwp2md)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "markitdown[pdf,pptx,docx,xlsx]>=0.1.6",
    "python-pptx>=1.0",
    "pyhwp2md>=0.1.3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # OCR + document-structure parsing: PaddleOCR PP-StructureV3. Needs the
    # paddlex[ocr] extras (layout/table models) — without them the pipeline
    # raises DependencyError at construction.
    # Pillow/numpy decode image bytes in memory so no image is written to disk.
    "paddleocr>=3.3",
    "paddlex[ocr]>=3.3",
    # Folding OCR is GPU-only. Making the CUDA wheel a base dependency prevents
    # a normal setup from silently creating a CPU-only runtime.
    "paddlepaddle-gpu>=3.2",
    # Paddle's Windows wheel does not bundle cuDNN. The NVIDIA package also
    # supplies its matching cuBLAS/NVRTC runtime dependencies.
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
    "pillow>=10.0",
    "numpy>=1.26",
    # Scanned PDF page rendering
    "pymupdf>=1.24",
]

[project.optional-dependencies]
agent = [
    "claude-agent-sdk>=0.2.124",
    "httpx>=0.27",
]
# Object-storage sources (`{"kind": "uri", "uri": "s3://..."}`) for a deployment
# where doc2md does not share a filesystem with its caller. Not needed for the
# co-located default, which only ever sees local paths.
uri = [
    "fsspec>=2024.6",
    "s3fs>=2024.6",
]
test = [
    "pytest>=8.0",
]
# Retained as an empty compatibility extra for existing setup commands. The GPU
# wheel is now mandatory and is installed by a normal `uv sync`.
gpu = []

# uv resolves paddlepaddle-gpu from PaddlePaddle's index automatically; the
# index is `explicit` so nothing else is pulled from it.
[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu126" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
