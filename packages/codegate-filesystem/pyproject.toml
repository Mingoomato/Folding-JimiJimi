[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codegate-filesystem"
version = "0.1.0"
description = "Cross-platform confined and crash-safe filesystem primitives for Folding"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pywin32>=312,<313; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codegate_filesystem"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
