schema_version: "1.0.0"
wiki_version: "0.1.0"
prompt_version: enrichment-v1

compatibility:
  accepted_enrichment_fingerprints:
    - f1c34c90254d02b7eb93f443ca61de11c97ebb3a238ed9ce16748295d007713c

paths:
  input_dir: ../samples/input
  storage_root: ../wiki-storage
  output_dir: ../llm-wiki
  schemas_dir: schemas
  prompt_file: prompts/enrichment-v1.md
  enrichment_dir: enrichment
  env_file: .env

defaults:
  tenant_id: local
  wiki_id: sample-wiki
  synthetic_corpus: true

normalization:
  unicode: NFC
  line_endings: LF
  trim_trailing_whitespace: true
  section_anchor_prefix: sec-
  section_anchor_hash_length: 10

input_limits:
  max_documents: 10000
  max_source_files: 50000
  max_markdown_file_bytes: 10485760
  max_total_markdown_bytes: 1073741824
  max_sections_per_document: 500
  max_semantic_chunk_chars: 12000

chunking:
  max_chars: 2400
  overlap_chars: 200

provider:
  name: google-gemini
  api: generateContent
  api_version: v1beta
  base_url: https://generativelanguage.googleapis.com
  requested_model: gemini-2.5-flash-lite
  model: gemini-2.5-flash-lite
  migration_reason: none
  api_key_env: GEMINI_API_KEY
  temperature: 0.1
  top_p: 0.8
  top_k: 20
  seed: 42
  max_output_tokens: 8192
  thinking_budget: 0
  request_timeout_seconds: 180
  api_max_attempts: 5
  retry_base_seconds: 1.0
  data_policy: development-free
  pricing:
    currency: USD
    effective_on: 2026-07-22
    input_per_million_tokens: 0.10
    output_per_million_tokens: 0.40

security:
  require_paid_policy_for_nonpublic: true
  paid_policy_name: paid-no-training
  external_llm_allowed_access:
    - public
    - internal
  block_restricted: true

enrichment:
  max_attempts: 3
  max_input_chars: 80000
  max_input_sections: 64
  summary_min_sentences: 2
  summary_max_sentences: 3
  key_points_min: 3
  key_points_max: 5
  keywords_min: 5
  keywords_max: 10
  faq_min: 2
  faq_max: 3
  relation_types:
    - references
    - implements
    - implemented_by
    - based_on
    - supersedes
    - superseded_by
