[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-wiki-local-runtime"
version = "0.1.0"
description = "Local source-event orchestrator for the LLM Wiki builder"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "codegate-filesystem",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<0.29",
  "llm-wiki-builder",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<0.12",
]

[project.scripts]
llm-wiki-local = "llm_wiki_local.api:main"

[tool.uv.sources]
codegate-filesystem = { path = "../../packages/codegate-filesystem", editable = true }
llm-wiki-builder = { path = "../wiki-builder", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/llm_wiki_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
